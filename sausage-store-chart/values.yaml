global:
  imagePullPolicy: Always

frontend:
  image: akurnenkov/sausage-frontend:latest
  replicas: 1
  revisionHistoryLimit: 3
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  nginxConf: nginx.conf
  containerPort: 80
  service:
    port: 80
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations: {}
    host: front-akurnenkov.2sem.students-projects.ru
    path: /
    pathType: Prefix
    secretName: 2sem-students-projects-wildcard-secret

backend:
  image: akurnenkov/sausage-backend:latest
  replicas: 1
  revisionHistoryLimit: 3
  env:
    POSTGRES_URI: jdbc:postgresql://postgresql:5432/sausage-store
    POSTGRES_USER: store
    POSTGRES_PASSWORD: storepassword
    MONGO_URI: mongodb://root:rootpassword@mongodb:27017/sausage-reports?authSource=admin
    reportPath: /logs/reports
    logPath: /logs
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  containerPort: 8080
  service:
    port: 8080
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  livenessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /actuator/health
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  annotations:
    path: /actuator/prometheus
    port: "8080"
    scrape: "true"
  vpa:
    updatePolicy:
      updateMode: "Auto"
    resourcePolicy:
      containerPolicies:
        - containerName: "*"
          minAllowed:
            cpu: "100m"
            memory: "256Mi"
          maxAllowed:
            cpu: "1"
            memory: "512Mi"
          controlledResources: ["cpu", "memory"]
          controlledValues: RequestsAndLimits

backend-report:
  image: akurnenkov/sausage-backend-report:latest
  replicas: 1
  revisionHistoryLimit: 3
  env:
    PORT: 8081
    DB: mongodb://root:rootpassword@mongodb:27017/sausage-reports?authSource=admin
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  containerPort: 8081
  service:
    port: 8081
  strategy:
    type: Recreate
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    metrics:
      - type: Resource
        resource:
          name: memory
          target:
            type: Utilization
            averageUtilization: 80
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 80

infra:
  postgresql:
    image: postgres:15-alpine
    env:
      POSTGRES_DB: sausage-store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: storepassword
    containerPort: 5432
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "100m"
    storageSize: 1Gi

  mongodb:
    image: mongo:7.0
    env:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    containerPort: 27017
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "100m"
    storageSize: 1Gi
    init:
      enabled: true
      database: sausage-store
      appUser: store
      appPassword: storepassword
